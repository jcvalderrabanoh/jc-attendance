name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jc_core
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jc_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Motor de cálculo
        run: npm run typecheck -w @jc-attendance/rules-engine && npm test -w @jc-attendance/rules-engine && npm run build -w @jc-attendance/rules-engine
      - name: API · typecheck (incluye specs)
        run: npm run typecheck -w @jc-attendance/api
      - name: API · pruebas unitarias
        run: npm test -w @jc-attendance/api
      - name: API · punta a punta (Postgres + Redis)
        run: npm run test:e2e -w @jc-attendance/api
      - name: API · build
        run: npm run build -w @jc-attendance/api
