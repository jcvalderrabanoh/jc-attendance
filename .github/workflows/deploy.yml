name: Deploy to EC2

# Mismo mecanismo que jc-core: SSM ejecuta deploy/release.sh en la instancia
# (proceso pm2 propio `jc-attendance-api`, puerto 3100, mismo EC2).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Hotfix: desplegar sin esperar los tests'
        type: boolean
        default: false

concurrency:
  group: deploy-ec2-attendance
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !(startsWith(github.event.head_commit.message, '[hotfix]') || inputs.skip_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @jc-attendance/rules-engine
      - run: npm run typecheck -w @jc-attendance/api && npm test -w @jc-attendance/api

  deploy:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Run deploy command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 3600 \
            --parameters 'commands=["sudo -u ec2-user bash -c \"cd /home/ec2-user/jc-attendance && git fetch origin main && git reset --hard origin/main && bash deploy/release.sh\""]' \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query 'Status' --output text 2>/dev/null || echo "InProgress")
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query 'StandardErrorContent' --output text
              exit 1
            fi
            sleep 10
          done
          echo "Timeout esperando deploy"; exit 1
