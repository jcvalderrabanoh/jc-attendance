# Checador dentro del server de core.lumen-view.com (lo incluye bootstrap-ec2.sh).
# API: /attendance/* → jc-attendance-api (:3100) sin el prefijo.
location /attendance/ {
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # Selfies de marcaje e importación de empleados (el API limita a 10 MB).
    client_max_body_size 12m;
}

# PWA del empleado y del kiosco.
location = /asistencia {
    return 301 /asistencia/;
}
location /asistencia/ {
    root /var/www;
    try_files $uri $uri/ /asistencia/index.html;
    # El service worker decide qué cachear; nginx siempre revalida.
    add_header Cache-Control "no-cache";
}
